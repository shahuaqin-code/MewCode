[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mewcode"
version = "0.1.0"
description = "A multi-protocol terminal conversation client"
requires-python = ">=3.12"
dependencies = ["textual>=8.2.8,<9", "rich>=13", "anthropic>=0.40,<1", "openai>=1.50,<3", "pyyaml>=6"]

[project.scripts]
mewcode = "mewcode.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/mewcode"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I"]
